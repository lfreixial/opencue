[package]
name = "opencue-core"
description = "Corsair device drivers, fan curves, RGB effects and screen renderers for OpenCUE"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
anyhow = "1.0.104"
fontdue = "0.9.5"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp", "bmp"] }
libc = "0.2.191"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
env_logger = "0.11.11"
